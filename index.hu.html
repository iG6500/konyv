document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

), background 240ms ease, color 240ms ease, border-color 240ms ease;\n  }\n  .copy-btn[disabled] { background: #dcd8ce; color: #4e565d; border-color: #c8c3b7; cursor: not-allowed; }\n  .copy-btn.picked { background: #1c4fa1; border-color: #1c4fa1; color: #f7f5f0; transform: translateY(-16px); }\n  .copy-btn .lbl { writing-mode: vertical-rl; text-orientation: mixed; display: flex; align-items: center; gap: 10px; }\n  .copy-btn[disabled] .lbl { text-decoration: line-through; }\n  .copy-btn .st { font-size: 8px; letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.85; }\n\n  .pick-banner {\n    display: none; margin-top: 16px; border: 1px solid #1c4fa1; background: #e4e8ea;\n    padding: 14px 16px; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;\n  }\n  .pick-banner.show { display: flex; }\n  .pick-banner span { font-family: 'Space Grotesk', sans-serif; font-size: 12px; letter-spacing: 0.04em; color: #10161c; }\n  .pick-banner a { font-family: 'Space Grotesk', sans-serif; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; text-decoration: none; color: #1c4fa1; white-space: nowrap; }\n\n  .phase-card {\n    min-width: 0; outline: none; position: relative; overflow: hidden;\n    border: 1px solid #c2c9ce; border-left: 6px solid #c2c9ce;\n    padding: 20px 18px 22px; display: grid; gap: 9px; align-content: start;\n    transition: background 300ms ease, color 300ms ease, border-color 300ms ease;\n    cursor: default;\n  }\n  .phase-stamp { position: absolute; top: 14px; right: -6px; font-family: 'Space Grotesk', sans-serif; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; border: 2px solid; padding: 5px 9px; opacity: 0.95; }\n  .phase-num { font-family: 'Space Grotesk', sans-serif; font-size: 34px; line-height: 1; letter-spacing: -0.02em; }\n  .phase-date { font-family: 'Space Grotesk', sans-serif; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; margin-top: 4px; }\n  .phase-title { font-size: 23px; line-height: 1.12; }\n  .phase-note { font-size: 15px; line-height: 1.6; max-width: 30ch; }\n\n  #book-spread .page { transition: transform 1100ms cubic-bezier(.22,.8,.24,1); backface-visibility: hidden; }\n  #book-spread .page-left { transform: rotateY(78deg); }\n  #book-spread .page-right { transform: rotateY(-78deg); }\n  #book-spread.open .page-left { transform: rotateY(9deg); }\n  #book-spread.open .page-right { transform: rotateY(-9deg); }\n  #book-spread .rd { opacity: 0; transition: opacity 420ms ease, background 240ms ease, box-shadow 240ms ease; }\n  #book-spread.open .rd { opacity: 1; }\n  @media (prefers-reduced-motion: reduce) {\n    #book-spread .page { transition: none; }\n    #book-spread .page-left { transform: rotateY(9deg); }\n    #book-spread .page-right { transform: rotateY(-9deg); }\n    #book-spread .rd { opacity: 1; }\n  }\n\n  #sticky-cta { transform: translateY(110%); transition: transform 360ms cubic-bezier(.2,.8,.3,1); }\n  #sticky-cta.up { transform: translateY(0); }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div>\n\n  <div id=\"attn-bar\" style=\"background: #1c4fa1; color: #f7f5f0; padding: 13px 20px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px 16px; text-align: center; font-family: 'Space Grotesk', sans-serif; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase;\">\n    <span style=\"display: inline-flex; align-items: center; gap: 10px;\"><span style=\"width: 8px; height: 8px; background: #f7f5f0; display: inline-block;\"><\u002Fspan>Figyelem<\u002Fspan>\n    <span style=\"letter-spacing: 0.06em; text-transform: none; font-size: 14px;\">Húsz számozott példány készül. Az előrendelés október 25-én nyit — <span id=\"attn-days\" style=\"border-bottom: 1px solid rgba(247,245,240,0.6);\"><\u002Fspan> van addig.<\u002Fspan>\n  <\u002Fdiv>\n\n  <nav class=\"om-rail\" id=\"om-rail\" style=\"position: fixed; right: 22px; top: 50%; transform: translateY(-50%); z-index: 40; background: #f7f5f0; border: 1px solid #10161c; box-shadow: 3px 3px 0 #10161c; padding: 14px 4px 14px 0; display: grid; gap: 2px;\"><\u002Fnav>\n\n  <div id=\"sticky-cta\" style=\"position: fixed; left: 0; right: 0; bottom: 0; z-index: 45; background: #10161c; border-top: 1px solid #3b444e; color: #f7f5f0; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 12px 22px; padding: 12px clamp(14px, 3vw, 34px);\">\n    <div style=\"display: flex; align-items: center; gap: 14px; min-width: 0;\">\n      <div style=\"width: 30px; height: 44px; flex: none; background-image: repeating-linear-gradient(135deg, #1c4fa1 0 6px, #16408a 6px 12px); border: 1px solid #f7f5f0;\"><\u002Fdiv>\n      <span style=\"font-family: 'Space Grotesk', sans-serif; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #c6ccd3;\" id=\"sticky-text\"><\u002Fspan>\n    <\u002Fdiv>\n    <a href=\"#varolista\" class=\"hover-fill\" style=\"font-family: 'Space Grotesk', sans-serif; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; text-decoration: none; background: #1c4fa1; color: #f7f5f0; padding: 14px 22px; border: 1px solid #1c4fa1; white-space: nowrap;\">Érdeklődő feliratkozás →<\u002Fa>\n  <\u002Fdiv>\n\n  <div style=\"max-width: 1180px; margin: 0 auto; padding: 0 clamp(14px, 3vw, 34px) 130px;\">\n\n    \n\n    <section data-sec=\"hero\" style=\"border: 1px solid #10161c; margin-top: 18px; background: #10161c; color: #f7f5f0; position: relative; overflow: hidden; min-height: min(88vh, 900px); display: grid; align-content: center; padding: clamp(40px, 7vw, 96px) clamp(20px, 4vw, 64px);\">\n\n      <div style=\"position: absolute; inset: 0; background-image: repeating-linear-gradient(0deg, rgba(247,245,240,0.05) 0 1px, transparent 1px 46px); pointer-events: none;\"><\u002Fdiv>\n\n      <span style=\"position: relative; z-index: 2; justify-self: start; margin-bottom: clamp(20px, 3vw, 34px); border: 1px solid #3b444e; background: #171f27; color: #c6ccd3; font-family: 'Space Grotesk', sans-serif; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; padding: 10px 16px;\">Kézirat lezárva · az első húsz példány dedikálva<\u002Fspan>\n\n      <h1 style=\"margin: 0; font-weight: 400; letter-spacing: -0.035em; line-height: 0.86; font-size: clamp(40px, 9vw, 144px); position: relative; z-index: 2; padding-right: clamp(0px, 27vw, 460px);\">\n        <span style=\"display: block;\">Bárány<span style=\"font-style: italic;\">bőrbe<\u002Fspan><\u002Fspan>\n        <span style=\"display: block; color: transparent; -webkit-text-stroke: 1.5px #7fa8e8;\">bújt<\u002Fspan>\n        <span style=\"display: block;\">pásztor<\u002Fspan>\n      <\u002Fh1>\n\n      <div style=\"position: absolute; right: clamp(-30px, 2vw, 70px); top: 50%; transform: translateY(-50%) rotate(-4.5deg); width: clamp(150px, 25vw, 360px); z-index: 3;\">\n        <div style=\"aspect-ratio: 2 / 3; background-image: repeating-linear-gradient(135deg, #1c4fa1 0 10px, #16408a 10px 20px); border: 1px solid #f7f5f0; box-shadow: -22px 26px 0 rgba(0,0,0,0.45); display: grid; place-items: center; padding: 18px;\">\n          <span style=\"font-family: 'Space Grotesk', sans-serif; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; text-align: center; color: #f7f5f0; border: 1px solid rgba(247,245,240,0.55); padding: 9px 12px;\">borító helye<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"font-family: 'Space Grotesk', sans-serif; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: #8d959d; margin: 12px 0 0; text-align: right;\">Első kiadás · kötött<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"position: relative; z-index: 2; margin-top: clamp(28px, 4vw, 56px); display: grid; gap: 18px; max-width: 46ch;\">\n        <p style=\"font-size: clamp(17px, 1.5vw, 21px); line-height: 1.55; margin: 0; color: #dfe3e8;\">Egy éve írom ezt a könyvet, és most először engedem közel bárkit.<\u002Fp>\n        <p style=\"font-family: 'Space Grotesk', sans-serif; font-size: 12px; line-height: 1.7; letter-spacing: 0.04em; margin: 0; color: #f7f5f0; border-left: 2px solid #1c4fa1; padding-left: 14px;\">Az előrendelés október 25-én nyit. Addig csak érdeklődő feliratkozásokat gyűjtök — fizetés nincs, a jelentkezés nem kötelez semmire.<\u002Fp>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 12px; margin-top: 6px;\">\n          <a href=\"#varolista\" class=\"hover-fill\" style=\"font-family: 'Space Grotesk', sans-serif; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; text-decoration: none; background: #1c4fa1; color: #f7f5f0; padding: 15px 24px; border: 1px solid #1c4fa1;\">Érdeklődő feliratkozás<\u002Fa>\n          <a href=\"#jegyzek\" class=\"hover-line\" style=\"font-family: 'Space Grotesk', sans-serif; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; text-decoration: none; padding: 15px 24px; border: 1px solid #3b444e; color: #f7f5f0;\">Példányjegyzék<\u002Fa>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 8px 24px; margin-top: 4px; font-family: 'Space Grotesk', sans-serif; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #8d959d;\">\n          <span style=\"display: flex; align-items: center; gap: 8px;\"><span style=\"width: 6px; height: 6px; background: #7fa8e8;\"><\u002Fspan>Fizetés nincs<\u002Fspan>\n          <span style=\"display: flex; align-items: center; gap: 8px;\"><span style=\"width: 6px; height: 6px; background: #7fa8e8;\"><\u002Fspan>Nem kötelez semmire<\u002Fspan>\n          <span style=\"display: flex; align-items: center; gap: 8px;\"><span style=\"width: 6px; height: 6px; background: #7fa8e8;\"><\u002Fspan>Legfeljebb három levél<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"border: 1px solid #10161c; border-top: none; background: #10161c; color: #f7f5f0; display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));\">\n      <div style=\"min-width: 0; padding: clamp(24px, 3.5vw, 42px) clamp(20px, 3vw, 34px); border-right: 1px solid #2b333c; display: grid; gap: 12px; align-content: start;\">\n        <span style=\"font-family: 'Space Grotesk', sans-serif; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: #7fa8e8;\">I. A kézirat<\u002Fspan>\n        <p style=\"font-size: 18px; line-height: 1.55; margin: 0; color: #dfe3e8;\">Egyetlen oldal van kint belőle, annak is a nagyobb része lefedve.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"min-width: 0; padding: clamp(24px, 3.5vw, 42px) clamp(20px, 3vw, 34px); border-right: 1px solid #2b333c; display: grid; gap: 12px; align-content: start;\">\n        <span style=\"font-family: 'Space Grotesk', sans-serif; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: #7fa8e8;\">II. A jegyzék<\u002Fspan>\n        <p style=\"font-size: 18px; line-height: 1.55; margin: 0; color: #dfe3e8;\">Húsz számozott kötet, kézzel írt névvel és pár soros ajánlással.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"min-width: 0; padding: clamp(24px, 3.5vw, 42px) clamp(20px, 3vw, 34px); display: grid; gap: 12px; align-content: start;\">\n        <span style=\"font-family: 'Space Grotesk', sans-serif; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: #7fa8e8;\">III. A nyitás<\u002Fspan>\n        <p style=\"font-size: 18px; line-height: 1.55; margin: 0; color: #dfe3e8;\">Október 25. A listások egy nappal korábban kapják a linket.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section data-sec=\"tartalom\" style=\"border: 1px solid #10161c; border-top: none; background: #f7f5f0; padding: clamp(26px, 4vw, 52px);\">\n      <div style=\"display: flex; align-items: center; gap: 18px; margin-bottom: 34px;\">\n        <span style=\"font-family: 'Space Grotesk', sans-serif; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: #1c4fa1; white-space: nowrap;\">Tartalom<\u002Fspan>\n        <span style=\"flex: 1 1 auto; height: 1px; background: #cdc8bd;\"><\u002Fspan>\n        <span style=\"font-family: 'Space Grotesk', sans-serif; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: #5d6670; white-space: nowrap;\">[fejezetszám] fejezet<\u002Fspan>\n      <\u002Fdiv>\n      <div id=\"toc-grid\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 2px 48px;\"><\u002Fdiv>\n      <p style=\"font-family: 'Space Grotesk', sans-serif; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: #5d6670; margin: 30px 0 0;\">A fejezetcímek október 25-én kerülnek le a listáról.<\u002Fp>\n    <\u002Fsection>\n\n    <section data-sec=\"kezirat\" style=\"border: 1px solid #10161c; border-top: none; background: #10161c; color: #f7f5f0; padding: clamp(28px, 4vw, 60px) clamp(20px, 4vw, 56px);\">\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: clamp(24px, 4vw, 56px); align-items: start; margin-bottom: clamp(30px, 4vw, 52px);\">\n        <div style=\"min-width: 0; display: grid; gap: 18px; align-content: start;\">\n          <p style=\"font-family: 'Space Grotesk', sans-serif; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: #7fa8e8; margin: 0;\">27. oldal, részlet<\u002Fp>\n          <h2 style=\"font-size: clamp(28px, 3.6vw, 52px); line-height: 1.04; font-weight: 400; margin: 0; letter-spacing: -0.02em;\">A szöveg zárolva. Ami átszivárog, a tiéd.<\u002Fh2>\n        <\u002Fdiv>\n        <div style=\"min-width: 0; display: grid; gap: 18px; align-content: start;\">\n          <p style=\"font-size: clamp(16px, 1.3vw, 19px); line-height: 1.6; margin: 0; max-width: 40ch; color: #c6ccd3;\">A kéziratból egyetlen oldal van kint, és annak is a nagyobb része le van fedve. Vidd rá a kurzort a könyv lécvégeire, és annyit olvashatsz, amennyit kibontasz.<\u002Fp>\n          <div style=\"border: 1px solid #3b444e; background: #171f27; padding: 16px 18px; display: grid; gap: 8px;\">\n            <span style=\"font-family: 'Space Grotesk', sans-serif; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #7fa8e8;\" id=\"reveal-label-box\"><\u002Fspan>\n            <div style=\"height: 4px; background: #2b333c; position: relative;\">\n              <div id=\"reveal-bar\" style=\"position: absolute; left: 0; top: 0; bottom: 0; width: 0%; background: #1c4fa1; transition: width 300ms ease;\"><\u002Fdiv>\n            <\u002Fdiv>\n            <span style=\"font-family: 'Space Grotesk', sans-serif; font-size: 11px; line-height: 1.6; color: #b3bac2;\" id=\"found-label\"><\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"perspective: 2000px; display: grid; justify-items: center; gap: 20px;\">\n        <div id=\"book-spread\" style=\"width: 100%; max-width: 1000px; display: grid; grid-template-columns: 1fr 1fr; transform-style: preserve-3d; box-shadow: 0 46px 70px -34px rgba(0,0,0,0.85);\">\n          <div class=\"page page-left\" style=\"background: #f7f5f0; color: #10161c; padding: clamp(22px, 3.4vw, 46px) clamp(18px, 2.8vw, 38px); min-height: clamp(280px, 32vw, 460px); display: grid; align-content: space-between; gap: 20px; transform-origin: right center; background-image: linear-gradient(to left, rgba(16,22,28,0.20), rgba(16,22,28,0) 14%);\">\n            <div id=\"page-left-text\" style=\"font-size: clamp(13px, 1.15vw, 16px); line-height: 2.05; text-align: justify; hyphens: auto;\"><\u002Fdiv>\n            <span style=\"font-family: 'Space Grotesk', sans-serif; font-size: 10px; letter-spacing: 0.14em; color: #8d959d;\">26<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"page page-right\" style=\"background: #f7f5f0; color: #10161c; padding: clamp(22px, 3.4vw, 46px) clamp(18px, 2.8vw, 38px); min-height: clamp(280px, 32vw, 460px); display: grid; align-content: space-between; gap: 20px; transform-origin: left center; background-image: linear-gradient(to right, rgba(16,22,28,0.20), rgba(16,22,28,0) 14%);\">\n            <div id=\"page-right-text\" style=\"font-size: clamp(13px, 1.15vw, 16px); line-height: 2.05; text-align: justify; hyphens: auto;\"><\u002Fdiv>\n            <span style=\"font-family: 'Space Grotesk', sans-serif; font-size: 10px; letter-spacing: 0.14em; color: #8d959d; justify-self: end;\">27<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"font-family: 'Space Grotesk', sans-serif; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #8d959d; margin: 0; text-align: center;\">A könyv kinyílik, a lécek maradnak. Ami feltárul, azt te tártad fel.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section data-sec=\"konyv\" style=\"border: 1px solid #10161c; border-top: none; background: #10161c; color: #f7f5f0;\">\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));\">\n        <div style=\"padding: clamp(24px, 4vw, 52px); min-width: 0; border-right: 1px solid #2b333c;\">\n          <p style=\"font-family: 'Space Grotesk', sans-serif; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: #7fa8e8; margin: 0 0 26px;\">A könyvről<\u002Fp>\n          <p style=\"font-size: clamp(20px, 2vw, 28px); line-height: 1.4; font-style: italic; margin: 0 0 26px; max-width: 32ch;\">A cím megvan, a kézirat kész. A többit október 25-én mondom el.<\u002Fp>\n          <p style=\"font-family: 'Space Grotesk', sans-serif; font-size: 12px; line-height: 1.9; margin: 0; color: #b3bac2; border-left: 2px solid #1c4fa1; padding-left: 16px;\">[fülszöveg helye — 3-4 mondat]<br>[szerző neve, egy soros bemutatkozás]<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"min-width: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));\">\n          <div style=\"min-height: 280px; background-image: repeating-linear-gradient(135deg, #171f27 0 8px, #10161c 8px 16px); display: flex; align-items: center; justify-content: center; padding: 18px; border-right: 1px solid #2b333c;\">\n            <span style=\"font-family: 'Space Grotesk', sans-serif; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; border: 1px solid #3b444e; color: #c2c8cf; padding: 8px 11px; text-align: center;\">borító helye<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"min-height: 280px; background-image: repeating-linear-gradient(135deg, #171f27 0 8px, #10161c 8px 16px); display: flex; align-items: center; justify-content: center; padding: 18px;\">\n            <span style=\"font-family: 'Space Grotesk', sans-serif; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; border: 1px solid #3b444e; color: #c2c8cf; padding: 8px 11px; text-align: center;\">szerzői portré helye<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    \n\n    <section data-sec=\"idovonal\" style=\"border: 1px solid #10161c; border-top: none; background: #e4e8ea; padding: clamp(26px, 4vw, 52px);\">\n      <div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: baseline; margin-bottom: 34px;\">\n        <p style=\"font-family: 'Space Grotesk', sans-serif; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; margin: 0;\">Hol tart a kiadás<\u002Fp>\n        <p style=\"font-family: 'Space Grotesk', sans-serif; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; margin: 0; color: #1c4fa1;\" id=\"step-counter\"><\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"display: flex; gap: 3px; margin-bottom: 30px;\" id=\"phase-track\"><\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px;\" id=\"phase-cards\"><\u002Fdiv>\n\n      <div style=\"margin-top: 26px; border-top: 1px solid #cdd3d6; padding-top: 16px; display: flex; flex-wrap: wrap; gap: 20px; font-family: 'Space Grotesk', sans-serif; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: #333c45;\">\n        <span style=\"display: flex; align-items: center; gap: 8px;\"><span style=\"width: 14px; height: 8px; background: #10161c;\"><\u002Fspan>Lezárt<\u002Fspan>\n        <span style=\"display: flex; align-items: center; gap: 8px;\"><span style=\"width: 14px; height: 8px; background: #1c4fa1;\"><\u002Fspan>Most itt<\u002Fspan>\n        <span style=\"display: flex; align-items: center; gap: 8px;\"><span style=\"width: 14px; height: 8px; background: #c2c9ce;\"><\u002Fspan>Hátravan<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section data-sec=\"jegyzek\" id=\"jegyzek\" style=\"border: 1px solid #10161c; border-top: none; background: #f7f5f0; padding: clamp(26px, 4vw, 52px);\">\n      <div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: baseline; margin-bottom: 10px;\">\n        <h2 style=\"font-size: clamp(26px, 3vw, 42px); font-weight: 400; line-height: 1.06; margin: 0;\">Példányjegyzék 001–020<\u002Fh2>\n        <p style=\"font-family: 'Space Grotesk', sans-serif; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; margin: 0; color: #1c4fa1;\" id=\"claim-label\"><\u002Fp>\n      <\u002Fdiv>\n      <p style=\"font-size: 17px; line-height: 1.65; max-width: 58ch; margin: 0 0 26px; color: #333c45;\">Az első húsz kötetbe kézzel írom bele a nevet és egy pár soros ajánlást. Válaszd ki, melyik számot kéred — az igényléshez csatolom.<\u002Fp>\n      <div style=\"display: flex; flex-wrap: wrap; align-items: flex-end; gap: 4px; padding: 26px 10px 0; border-bottom: 6px solid #10161c;\" id=\"copy-shelf\"><\u002Fdiv>\n\n      <div class=\"pick-banner\" id=\"pick-banner\">\n        <span id=\"pick-banner-text\"><\u002Fspan>\n        <a href=\"#varolista\">Ugrás a jelentkezéshez ↓<\u002Fa>\n      <\u002Fdiv>\n\n      <p style=\"font-family: 'Space Grotesk', sans-serif; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: #5d6670; margin: 14px 0 0;\">A polcon minden kötet a saját száma. A megbillent, áthúzott gerincek már elkeltek.<\u002Fp>\n    <\u002Fsection>\n\n    <section data-sec=\"mit-kapsz\" style=\"border: 1px solid #10161c; border-top: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); background: #10161c;\">\n      <div style=\"padding: clamp(24px, 3.5vw, 44px) clamp(20px, 3vw, 34px); border-right: 1px solid #2b333c; min-width: 0; display: grid; gap: 13px; align-content: start; background: #eeeae1;\">\n        <span style=\"font-family: 'Space Grotesk', sans-serif; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: #1c4fa1;\">Első 20 példány<\u002Fspan>\n        <h2 style=\"font-size: clamp(23px, 2.4vw, 33px); font-weight: 400; line-height: 1.1; margin: 0;\">5 400 Ft, dedikálva<\u002Fh2>\n        <p style=\"font-size: 17px; line-height: 1.6; margin: 0; max-width: 32ch; color: #333c45;\">Kézzel írt név és pár soros ajánlás, számozott kötet. Amikor elfogy, nem nyílik újra.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"padding: clamp(24px, 3.5vw, 44px) clamp(20px, 3vw, 34px); border-right: 1px solid #2b333c; min-width: 0; display: grid; gap: 13px; align-content: start; background: #eeeae1;\">\n        <span style=\"font-family: 'Space Grotesk', sans-serif; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: #1c4fa1;\">Utána<\u002Fspan>\n        <h2 style=\"font-size: clamp(23px, 2.4vw, 33px); font-weight: 400; line-height: 1.1; margin: 0;\">Felolvasóest<\u002Fh2>\n        <p style=\"font-size: 17px; line-height: 1.6; margin: 0; max-width: 32ch; color: #333c45;\">Zárt körű online írói est, kizárólag előrendelőknek.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"padding: clamp(24px, 3.5vw, 44px) clamp(20px, 3vw, 34px); min-width: 0; display: grid; gap: 13px; align-content: start; background: #eeeae1;\">\n        <span style=\"font-family: 'Space Grotesk', sans-serif; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: #1c4fa1;\">Black Friday után<\u002Fspan>\n        <h2 style=\"font-size: clamp(23px, 2.4vw, 33px); font-weight: 400; line-height: 1.1; margin: 0;\">5 900 Ft<\u002Fh2>\n        <p style=\"font-size: 17px; line-height: 1.6; margin: 0; max-width: 32ch; color: #333c45;\">Az early bird zárul, a bónuszok lekerülnek. Szállítás december elejétől.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section data-sec=\"varolista\" id=\"varolista\" style=\"border: 1px solid #10161c; border-top: none; background: #10161c; color: #f7f5f0; padding: clamp(28px, 5vw, 68px) clamp(22px, 4vw, 56px);\">\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: clamp(30px, 5vw, 68px); align-items: start;\">\n        <div style=\"min-width: 0;\">\n          <p style=\"font-family: 'Space Grotesk', sans-serif; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; margin: 0 0 22px; color: #7fa8e8;\">Az egyetlen, ami nincs kifedve<\u002Fp>\n          <h2 style=\"font-size: clamp(28px, 3.4vw, 48px); font-weight: 400; line-height: 1.05; margin: 0 0 20px;\">Egy nappal a nyitás előtt te látod először.<\u002Fh2>\n          <p style=\"font-size: 17px; line-height: 1.65; max-width: 40ch; margin: 0 0 24px; color: #c6ccd3;\">A dedikált húsz példány jó eséllyel a listáról fogy el. Fizetés csak október 25-én, a feliratkozás nem kötelez semmire.<\u002Fp>\n          <p style=\"font-family: 'Space Grotesk', sans-serif; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; margin: 0; color: #8d959d;\">Legfeljebb három levél a megjelenésig<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"min-width: 0;\">\n          <div id=\"waitlist-done\" style=\"display: none; border: 1px solid #1c4fa1; padding: 24px; gap: 10px;\">\n            <span style=\"font-size: 24px;\">Felvéve<\u002Fspan>\n            <span style=\"font-size: 16px; line-height: 1.6; color: #c6ccd3;\">Október 24-én küldöm a linket. <span id=\"picked-note\"><\u002Fspan><\u002Fspan>\n          <\u002Fdiv>\n          <form id=\"waitlist-form\" style=\"display: grid; gap: 18px;\">\n            <div id=\"picked-chip\" style=\"display: none; align-items: center; justify-content: space-between; gap: 12px; border: 1px solid #1c4fa1; background: rgba(28,79,161,0.18); padding: 12px 16px;\">\n              <span id=\"picked-chip-text\" style=\"font-family: 'Space Grotesk', sans-serif; font-size: 13px; letter-spacing: 0.02em; color: #f7f5f0;\"><\u002Fspan>\n              <button type=\"button\" id=\"picked-chip-clear\" style=\"background: none; border: none; color: #7fa8e8; font-family: 'Space Grotesk', sans-serif; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; padding: 0;\">Törlés<\u002Fbutton>\n            <\u002Fdiv>\n            <p style=\"font-family: 'Space Grotesk', sans-serif; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; margin: 0; color: #7fa8e8;\" id=\"picked-label\"><\u002Fp>\n            <input type=\"hidden\" id=\"picked-input\" name=\"pelda_szam\" value=\"\">\n            <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 18px;\">\n              <input required=\"\" name=\"nev\" placeholder=\"Név\" class=\"field-line\" style=\"font-family: 'Space Grotesk', sans-serif; font-size: 14px; padding: 13px 0; background: transparent; border: none; border-bottom: 1px solid #3b444e; color: #f7f5f0; border-radius: 0; min-width: 0;\">\n              <input required=\"\" type=\"email\" name=\"email\" placeholder=\"E-mail\" class=\"field-line\" style=\"font-family: 'Space Grotesk', sans-serif; font-size: 14px; padding: 13px 0; background: transparent; border: none; border-bottom: 1px solid #3b444e; color: #f7f5f0; border-radius: 0; min-width: 0;\">\n              <input name=\"telefon\" type=\"tel\" placeholder=\"Telefon\" class=\"field-line\" style=\"font-family: 'Space Grotesk', sans-serif; font-size: 14px; padding: 13px 0; background: transparent; border: none; border-bottom: 1px solid #3b444e; color: #f7f5f0; border-radius: 0; min-width: 0;\">\n              <label style=\"display: grid; gap: 6px; min-width: 0;\">\n                <span style=\"font-family: 'Space Grotesk', sans-serif; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: #8d959d;\">Hány példányt kér<\u002Fspan>\n                <input name=\"db\" type=\"number\" min=\"1\" value=\"1\" class=\"field-line\" style=\"font-family: 'Space Grotesk', sans-serif; font-size: 14px; padding: 8px 0; background: transparent; border: none; border-bottom: 1px solid #3b444e; color: #f7f5f0; border-radius: 0; min-width: 0;\">\n              <\u002Flabel>\n            <\u002Fdiv>\n            <input name=\"dedikalas\" placeholder=\"Dedikálás neve\" class=\"field-line\" style=\"font-family: 'Space Grotesk', sans-serif; font-size: 14px; padding: 13px 0; background: transparent; border: none; border-bottom: 1px solid #3b444e; color: #f7f5f0; border-radius: 0;\">\n            <button type=\"submit\" class=\"hover-fill\" style=\"font-family: 'Space Grotesk', sans-serif; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; background: #1c4fa1; color: #f7f5f0; border: 1px solid #1c4fa1; padding: 16px 26px; cursor: pointer; border-radius: 0; justify-self: start;\">Kérem a várólistát<\u002Fbutton>\n          <\u002Fform>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section data-sec=\"kerdesek\" style=\"border: 1px solid #10161c; border-top: none; background: #f7f5f0; padding: clamp(26px, 4vw, 52px);\">\n      <p style=\"font-family: 'Space Grotesk', sans-serif; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; margin: 0 0 28px; color: #5d6670;\">Kérdések<\u002Fp>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 34px;\">\n        <div style=\"min-width: 0;\">\n          <p style=\"font-family: 'Space Grotesk', sans-serif; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; margin: 0 0 10px; color: #1c4fa1;\">Mikor kapom meg?<\u002Fp>\n          <p style=\"font-size: 17px; line-height: 1.6; margin: 0;\">A szállítás december elején indul, a sorrend az előrendelés sorrendje.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"min-width: 0;\">\n          <p style=\"font-family: 'Space Grotesk', sans-serif; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; margin: 0 0 10px; color: #1c4fa1;\">Lesz utánnyomás?<\u002Fp>\n          <p style=\"font-size: 17px; line-height: 1.6; margin: 0;\">Nem. Ez az egy kiadás készül el, ennyi példányban.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"min-width: 0;\">\n          <p style=\"font-family: 'Space Grotesk', sans-serif; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; margin: 0 0 10px; color: #1c4fa1;\">Most kell fizetnem?<\u002Fp>\n          <p style=\"font-size: 17px; line-height: 1.6; margin: 0;\">Nem. A várólista ingyenes, csak a linket kapod meg elsőként.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"min-width: 0;\">\n          <p style=\"font-family: 'Space Grotesk', sans-serif; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; margin: 0 0 10px; color: #1c4fa1;\">Mi a dedikálás menete?<\u002Fp>\n          <p style=\"font-size: 17px; line-height: 1.6; margin: 0;\">Az igénylésnél megadod, kinek szóljon az ajánlás — én írom bele kézzel, a csomagolás előtt.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"font-family: 'Space Grotesk', sans-serif; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; margin: 46px 0 0; padding-top: 16px; border-top: 1px solid #ded9cf; color: #5d6670;\">Báránybőrbe bújt pásztor · első kiadás, 2026 · [kiadó / szerző adatai]<\u002Fp>\n    <\u002Fsection>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;takenCount&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:7,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:0,&quot;max&quot;:20,&quot;section&quot;:&quot;Jegyzék&quot;},&quot;chapterCount&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:16,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:4,&quot;max&quot;:30,&quot;section&quot;:&quot;Tartalom&quot;},&quot;stickyBar&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Elrendezés&quot;}}\">\nclass Component extends DCLogic {\n  componentDidMount() {\n    var props = this.props || {};\n    var TAKEN = props.takenCount == null ? 7 : props.takenCount;\n    var CHAPTERS = props.chapterCount == null ? 16 : props.chapterCount;\n    var STICKY = props.stickyBar === false ? false : true;\n    var root = document;\n\n    var TEXT = \"Aki a nyájat őrzi, annak nem kell farkasnak lennie ahhoz, hogy vigyen belőle. Elég, ha ismeri a kaput, a kutyák nevét, és azt a hangot, amire a bárányok maguktól elindulnak. A falu tizennégy éven át nem kérdezett semmit, mert minden reggel megvolt a tej, és minden vasárnap megvolt a mise. Én sem kérdeztem. Csak számoltam, és a szám nem stimmelt, de ezt akkor még nem mondtam el senkinek, mert nem tudtam, kinek mondanám. Márton bácsi harminc éve vezette a legelőt, és harminc éve mondta ugyanazt: a nyáj nem tud számolni, de érzi, ha kevesebben vannak. Én akkor még azt hittem, ez a pásztorok szokásos beszéde, olyan, mint az időjárásról. Aztán jött az az ősz, amikor a szám kétszer sem stimmelt, és a kapu reggelre mindig nyitva volt, pedig este én magam zártam be. A rendőr azt kérdezte, kire gyanakszom. Mondtam, hogy senkire, mert ez volt az igazság: nem gyanakodtam, tudtam. A falu addig hitte el a történetemet, amíg a történet illett ahhoz, amit magukról gondoltak. Amikor már nem illett, egyetlen éjszaka alatt lettem idegen egy helyen, ahol negyven évig laktam. A báránybőr nem álruha. A báránybőr az, amit rád adnak, hogy ne kelljen megkérdezniük, mi van alatta.\";\n\n    var all = TEXT.split(\" \");\n    var mask = all.map(function (w, i) { return !(i % 4 === 1 || w.length <= 3); });\n    var hiddenTotal = mask.filter(Boolean).length;\n    var revealed = {};\n    var foundCount = 0;\n\n    var pickedList = [];\n    var takenCount = TAKEN;\n    var hoverPhase = null;\n\n    var phaseDefs = [\n      { date: \"Most\", title: \"Érdeklődők gyűjtése\", note: \"Feliratkozol e-mailre — fizetés és kötelezettség nélkül. A lista dönti el, ki kapja elsőként a linket.\" },\n      { date: \"2026. okt. 25.\", title: \"Előrendelés nyit — 5 400 Ft\", note: \"Dedikált, számozott kötetek, amíg a jegyzék tart. A várólistások egy nappal előbb kapják a linket.\" },\n      { date: \"A húsz után\", title: \"Felolvasóest\", note: \"Minden további előrendelő meghívót kap a zárt online estre.\" },\n      { date: \"Black Friday után\", title: \"Early bird zárul\", note: \"Az ár 5 900 Ft-ra vált. Szállítás december elejétől.\" }\n    ];\n\n    function currentPhase() {\n      var now = new Date();\n      if (now < new Date(2026, 9, 25)) return 0;\n      if (now < new Date(2026, 10, 28)) return 1;\n      if (now < new Date(2026, 11, 5)) return 2;\n      return 3;\n    }\n    var curPhase = currentPhase();\n\n    var pageL = root.getElementById(\"page-left-text\");\n    var pageR = root.getElementById(\"page-right-text\");\n    var spans = [];\n\n    function renderRedacted() {\n      if (!pageL || !pageR) return;\n      pageL.innerHTML = \"\";\n      pageR.innerHTML = \"\";\n      spans = [];\n      var half = Math.ceil(all.length / 2);\n      all.forEach(function (w, i) {\n        var host = i < half ? pageL : pageR;\n        var span = document.createElement(\"span\");\n        span.textContent = w;\n        span.className = \"rd \" + (mask[i] ? \"redact\" + (revealed[i] ? \" open\" : \"\") : \"redact plain\");\n        span.style.transitionDelay = (200 + (i % half) * 8) + \"ms\";\n        if (mask[i]) {\n          (function (idx) {\n            span.addEventListener(\"mouseenter\", function () { revealWord(idx); });\n            span.addEventListener(\"touchstart\", function () { revealWord(idx); }, { passive: true });\n          })(i);\n        }\n        spans[i] = span;\n        host.appendChild(span);\n        host.appendChild(document.createTextNode(\" \"));\n      });\n    }\n\n    function revealWord(i) {\n      if (revealed[i]) return;\n      revealed[i] = true;\n      foundCount++;\n      if (spans[i]) spans[i].classList.add(\"open\");\n      updateRevealLabels();\n    }\n\n    function updateRevealLabels() {\n      var label = foundCount + \" / \" + hiddenTotal + \" feltárva\";\n      var pct = Math.round((foundCount / Math.max(hiddenTotal, 1)) * 100) + \"%\";\n      var head = root.getElementById(\"reveal-label-header\");\n      var box = root.getElementById(\"reveal-label-box\");\n      var barEl = root.getElementById(\"reveal-bar\");\n      if (head) head.textContent = label;\n      if (box) box.textContent = label;\n      if (barEl) barEl.style.width = pct;\n      var found = root.getElementById(\"found-label\");\n      if (!found) return;\n      found.textContent = foundCount === 0\n        ? \"Semmi sincs feltárva.\"\n        : (foundCount >= hiddenTotal\n          ? \"Az egész részlet a tiéd. A könyv többi része október 25-én.\"\n          : \"Ennyi maradhat. A többi október 25-én.\");\n    }\n\n    var days = Math.ceil((new Date(2026, 9, 25) - new Date()) / 86400000);\n    var dayLabel = days > 1 ? days + \" nap\" : days === 1 ? \"1 nap\" : days === 0 ? \"ma nyit\" : \"nyitva\";\n    var attnEl = root.getElementById(\"attn-days\");\n    if (attnEl) attnEl.textContent = days > 0 ? dayLabel : \"ma nyit\";\n    var stickyTextEl = root.getElementById(\"sticky-text\");\n    if (stickyTextEl) stickyTextEl.textContent = days > 0\n      ? \"Az előrendelés október 25-én nyit · \" + dayLabel\n      : \"Az előrendelés nyitva\";\n\n    /* tartalomjegyzék — kitakart fejezetcímek */\n    var tocEl = root.getElementById(\"toc-grid\");\n    if (tocEl) tocEl.innerHTML = \"\";\n    for (var c = 1; tocEl && c <= CHAPTERS; c++) {\n      var row = document.createElement(\"div\");\n      row.style.cssText = \"display:grid;grid-template-columns:auto 1fr;align-items:center;gap:18px;padding:13px 0;border-bottom:1px solid #e4dfd4;min-width:0;\";\n      var n = document.createElement(\"span\");\n      n.style.cssText = \"font-family:'Space Grotesk',sans-serif;font-size:13px;letter-spacing:0.1em;color:#1c4fa1;\";\n      n.textContent = String(c).padStart(2, \"0\");\n      var bar = document.createElement(\"span\");\n      bar.style.cssText = \"height:14px;background:#10161c;width:\" + (46 + ((c * 37) % 46)) + \"%;min-width:120px;\";\n      row.appendChild(n);\n      row.appendChild(bar);\n      tocEl.appendChild(row);\n    }\n\n    /* nyitott könyv — a zárolt belív feltárható */\n    var spread = root.getElementById(\"book-spread\");\n    if (spread) {\n      var bio = new IntersectionObserver(function (entries) {\n        entries.forEach(function (en) { if (en.isIntersecting) { spread.classList.add(\"open\"); bio.disconnect(); } });\n      }, { threshold: 0.2 });\n      bio.observe(spread);\n    }\n\n    var trackEl = root.getElementById(\"phase-track\");\n    var cardsEl = root.getElementById(\"phase-cards\");\n\n    function renderPhases() {\n      var focus = hoverPhase === null ? curPhase : hoverPhase;\n      trackEl.innerHTML = \"\";\n      cardsEl.innerHTML = \"\";\n\n      phaseDefs.forEach(function (p, i) {\n        var done = i < curPhase;\n        var isCur = i === curPhase;\n        var isFocus = i === focus;\n\n        var seg = document.createElement(\"div\");\n        seg.style.cssText = \"flex:1 1 0;min-width:0;height:10px;transition:background 300ms ease;background:\" +\n          (done ? \"#10161c\" : isCur ? \"#1c4fa1\" : \"#c2c9ce\");\n        trackEl.appendChild(seg);\n\n        var card = document.createElement(\"div\");\n        card.className = \"phase-card\";\n        card.tabIndex = 0;\n        card.style.background = isCur ? \"#1c4fa1\" : done ? \"#dfe3e6\" : isFocus ? \"#f2f4f5\" : \"transparent\";\n        card.style.color = isCur ? \"#f7f5f0\" : \"#10161c\";\n        card.style.borderColor = isCur ? \"#1c4fa1\" : done ? \"#b9c0c4\" : \"#c2c9ce\";\n        card.style.borderLeftColor = done ? \"#10161c\" : isCur ? \"#10161c\" : (isFocus ? \"#5d6670\" : \"#c2c9ce\");\n\n        var stamp = document.createElement(\"span\");\n        stamp.className = \"phase-stamp\";\n        stamp.textContent = done ? \"Lezárt\" : isCur ? \"Most itt\" : \"Hátravan\";\n        var stampColor = isCur ? \"#f7f5f0\" : done ? \"#10161c\" : \"#8d959d\";\n        stamp.style.color = stampColor;\n        stamp.style.borderColor = stampColor;\n        stamp.style.transform = \"rotate(\" + (done ? \"-7deg\" : isCur ? \"4deg\" : \"-3deg\") + \")\";\n\n        var num = document.createElement(\"span\");\n        num.className = \"phase-num\";\n        num.textContent = String(i + 1).padStart(2, \"0\");\n        num.style.color = isCur ? \"rgba(247,245,240,0.6)\" : done ? \"#8d959d\" : \"#a8b0b6\";\n\n        var date = document.createElement(\"span\");\n        date.className = \"phase-date\";\n        date.textContent = p.date;\n        date.style.color = isCur ? \"#cfe0f7\" : \"#5d6670\";\n\n        var title = document.createElement(\"span\");\n        title.className = \"phase-title\";\n        title.textContent = p.title;\n\n        var note = document.createElement(\"span\");\n        note.className = \"phase-note\";\n        note.textContent = p.note;\n        note.style.color = isCur ? \"#e6eef9\" : \"#333c45\";\n\n        card.appendChild(stamp);\n        card.appendChild(num);\n        card.appendChild(date);\n        card.appendChild(title);\n        card.appendChild(note);\n\n        card.addEventListener(\"mouseenter\", function () { hoverPhase = i; renderPhases(); });\n        card.addEventListener(\"focus\", function () { hoverPhase = i; renderPhases(); });\n\n        cardsEl.appendChild(card);\n      });\n\n      var stepEl = root.getElementById(\"step-counter\");\n      if (stepEl) stepEl.textContent = (curPhase + 1) + \" / \" + phaseDefs.length + \" szakasz\";\n    }\n\n    var shelfEl = root.getElementById(\"copy-shelf\");\n    var pickBanner = root.getElementById(\"pick-banner\");\n    var pickBannerText = root.getElementById(\"pick-banner-text\");\n    var pickedLabelEl = root.getElementById(\"picked-label\");\n\n    function renderShelf() {\n      shelfEl.innerHTML = \"\";\n      for (var i = 1; i <= 20; i++) {\n        (function (i) {\n          var isTaken = i <= takenCount;\n          var isPicked = pickedList.indexOf(i) !== -1;\n          var num = String(i).padStart(3, \"0\");\n\n          var btn = document.createElement(\"button\");\n          btn.type = \"button\";\n          btn.className = \"copy-btn\" + (isPicked ? \" picked\" : \"\");\n          btn.title = isTaken ? num + \" — már elkelt\" : num + \" — szabad, kattints\";\n          if (isTaken) btn.disabled = true;\n\n          var height = isPicked ? 216 : isTaken ? 168 : (176 + ((i * 7) % 5) * 8);\n          btn.style.height = height + \"px\";\n          if (isTaken) btn.style.transform = \"translateY(0) rotate(\" + (i % 2 === 0 ? \"3.5deg\" : \"-3.5deg\") + \")\";\n\n          var lbl = document.createElement(\"span\");\n          lbl.className = \"lbl\";\n          var numSpan = document.createElement(\"span\");\n          numSpan.textContent = num;\n          var stSpan = document.createElement(\"span\");\n          stSpan.className = \"st\";\n          stSpan.textContent = isTaken ? \"elkelt\" : isPicked ? \"tiéd\" : \"szabad\";\n          lbl.appendChild(numSpan);\n          lbl.appendChild(stSpan);\n          btn.appendChild(lbl);\n\n          if (!isTaken) {\n            btn.addEventListener(\"click\", function () {\n              var idx = pickedList.indexOf(i);\n              if (idx === -1) pickedList.push(i); else pickedList.splice(idx, 1);\n              pickedList.sort(function (a, b) { return a - b; });\n              renderShelf();\n              renderPickState();\n            });\n          }\n\n          shelfEl.appendChild(btn);\n        })(i);\n      }\n      var claimEl = root.getElementById(\"claim-label\");\n      if (claimEl) claimEl.textContent = takenCount + \" elkelt · \" + (20 - takenCount) + \" szabad\";\n    }\n\n    function renderPickState() {\n      var chip = root.getElementById(\"picked-chip\");\n      var chipText = root.getElementById(\"picked-chip-text\");\n      var hiddenInput = root.getElementById(\"picked-input\");\n      var qtyInput = form ? form.querySelector('input[name=\"db\"]') : null;\n      if (!chip || !chipText || !hiddenInput || !pickBanner || !pickBannerText || !pickedLabelEl) return;\n\n      if (pickedList.length > 0) {\n        var nums = pickedList.map(function (n) { return String(n).padStart(3, \"0\"); });\n        var isOne = nums.length === 1;\n        pickBanner.classList.add(\"show\");\n        pickBannerText.textContent = (isOne ? nums[0] + \"-as példány\" : nums.join(\", \") + \" számú példányok\") + \" kiválasztva — a jelentkezésnél már szerepel.\";\n        chip.style.display = \"flex\";\n        chipText.textContent = (isOne ? \"Kiválasztott példány: \" + nums[0] + \".\" : \"Kiválasztott példányok: \" + nums.join(\", \") + \".\");\n        pickedLabelEl.textContent = \"\";\n        hiddenInput.value = nums.join(\",\");\n        if (qtyInput) qtyInput.value = pickedList.length;\n      } else {\n        pickBanner.classList.remove(\"show\");\n        chip.style.display = \"none\";\n        pickedLabelEl.textContent = \"Példányszám kiválasztása opcionális (jegyzék fent)\";\n        hiddenInput.value = \"\";\n      }\n    }\n\n    var clearBtn = root.getElementById(\"picked-chip-clear\");\n    if (clearBtn) clearBtn.addEventListener(\"click\", function () {\n      pickedList = [];\n      renderShelf();\n      renderPickState();\n    });\n\n    var form = root.getElementById(\"waitlist-form\");\n    var doneEl = root.getElementById(\"waitlist-done\");\n    var pickedNoteEl = root.getElementById(\"picked-note\");\n\n    if (form) form.addEventListener(\"submit\", function (e) {\n      e.preventDefault();\n      if (pickedNoteEl) pickedNoteEl.textContent = pickedList.length\n        ? (pickedList.length === 1\n          ? \"A \" + String(pickedList[0]).padStart(3, \"0\") + \" számú példányt fenntartom neked a nyitásig.\"\n          : \"A \" + pickedList.map(function (n) { return String(n).padStart(3, \"0\"); }).join(\", \") + \" számú példányokat fenntartom neked a nyitásig.\")\n        : \"\";\n      form.style.display = \"none\";\n      if (doneEl) doneEl.style.display = \"grid\";\n    });\n\n    var railDefs = [\n      { id: \"hero\", label: \"Címlap\", href: \"#\" },\n      { id: \"tartalom\", label: \"Tartalom\", href: \"#\" },\n      { id: \"kezirat\", label: \"Betekintő\", href: \"#\" },\n      { id: \"konyv\", label: \"A könyvről\", href: \"#\" },\n      { id: \"idovonal\", label: \"Folyamat\", href: \"#\" },\n      { id: \"jegyzek\", label: \"Jegyzék\", href: \"#jegyzek\" },\n      { id: \"mit-kapsz\", label: \"Mit kapsz\", href: \"#jegyzek\" },\n      { id: \"varolista\", label: \"Várólista\", href: \"#varolista\" },\n      { id: \"kerdesek\", label: \"Kérdések\", href: \"#varolista\" }\n    ];\n    var activeSec = \"hero\";\n    var railEl = root.getElementById(\"om-rail\");\n    var railLinks = {};\n    if (railEl) railEl.innerHTML = \"\";\n\n    railDefs.forEach(function (r) {\n      var a = document.createElement(\"a\");\n      a.href = r.href;\n      a.style.cssText = \"display:grid;grid-template-columns:4px auto;gap:12px;align-items:center;text-decoration:none;font-family:'Space Grotesk',sans-serif;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;padding:7px 16px 7px 0;transition:color 240ms ease, background 240ms ease;\";\n      var bar = document.createElement(\"span\");\n      bar.style.cssText = \"width:4px;height:100%;min-height:14px;transition:background 240ms ease;\";\n      var lbl = document.createElement(\"span\");\n      lbl.textContent = r.label;\n      a.appendChild(bar);\n      a.appendChild(lbl);\n      railEl.appendChild(a);\n      railLinks[r.id] = { a: a, bar: bar };\n    });\n\n    function updateRail() {\n      railDefs.forEach(function (r) {\n        var on = r.id === activeSec;\n        var refs = railLinks[r.id];\n        refs.a.style.color = on ? \"#10161c\" : \"#5d6670\";\n        refs.a.style.background = on ? \"#e4e8ea\" : \"transparent\";\n        refs.bar.style.background = on ? \"#1c4fa1\" : \"transparent\";\n      });\n    }\n\n    var sections = Array.prototype.slice.call(root.querySelectorAll(\"[data-sec]\"));\n    var io = new IntersectionObserver(function (entries) {\n      entries.forEach(function (en) {\n        if (en.isIntersecting) {\n          var id = en.target.getAttribute(\"data-sec\");\n          if (id !== activeSec) { activeSec = id; updateRail(); }\n        }\n      });\n    }, { rootMargin: \"-45% 0px -45% 0px\" });\n    sections.forEach(function (el) { io.observe(el); });\n\n    /* ragadós alsó sáv */\n    var sticky = root.getElementById(\"sticky-cta\");\n    if (!STICKY) {\n      sticky.style.display = \"none\";\n    } else {\n      var formVisible = false;\n      var scroller = root.scrollingElement || document.documentElement;\n      var updateSticky = function () {\n        var past = (window.scrollY || scroller.scrollTop || 0) > 640;\n        sticky.classList.toggle(\"up\", past && !formVisible);\n      };\n      var fio = new IntersectionObserver(function (entries) {\n        entries.forEach(function (en) { formVisible = en.isIntersecting; });\n        updateSticky();\n      }, { threshold: 0.15 });\n      var formSec = root.getElementById(\"varolista\");\n      if (formSec) fio.observe(formSec);\n      window.addEventListener(\"scroll\", updateSticky, { passive: true });\n      updateSticky();\n    }\n\n    renderRedacted();\n    updateRevealLabels();\n    renderPhases();\n    renderShelf();\n    renderPickState();\n    updateRail();\n  }\n  renderVals() { return {}; }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
